name: Build and Push Docker Image

on:
  push:
    branches: [main, content]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'content' && 'main' || github.sha }}

      - name: Checkout writing and media
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'content' && github.sha || 'content' }}
          path: .content

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: registry.baileys.dev/blog:latest
