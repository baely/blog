# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Hugo site: notes are leaf bundles at content/notes/YYYY-MM-DD/index.md with TOML front matter.

settings:
  content:
    # Keep any front matter keys the editor doesn't know about.
    merge: true

media:
  input: baely.au/static/images
  output: /images
  rename: safe
  categories: [image]

content:
  - name: notes
    label: Notes
    description: Personal notes, rambling, and the occasional longer essay.
    type: collection
    path: baely.au/content/notes
    format: toml-frontmatter
    exclude: [_index.md]
    filename:
      # The publication date is also the stable URL slug.
      template: "{fields.date}/index.md"
      field: false
    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: nodes
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, description]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
        description: Used in the URL, for example /notes/2026-03-10/.
        options:
          time: false
          format: yyyy-MM-dd
      - name: description
        label: Description
        type: text
        description: One or two sentences. Used as the meta description. Feed previews are generated automatically.
      - name: hide_title
        label: Hide title in feed
        type: boolean
        default: false
        description: For short thoughts or photos. The title is still used on the individual page.
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  - name: notes-index
    label: Notes page
    description: Heading and intro for the /notes/ listing page.
    type: file
    path: baely.au/content/notes/_index.md
    format: toml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  - name: posts
    label: Blog posts
    type: collection
    path: blog.baileys.dev/content/posts
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
      - name: draft
        type: boolean
      - name: tags
        type: string
        list: true
      - name: body
        type: rich-text
  - name: about
    label: About
    type: file
    path: blog.baileys.dev/content/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
  - name: blog-home
    label: Blog introduction
    type: file
    path: blog.baileys.dev/content/_index.md
    format: yaml-frontmatter
    fields:
      - name: body
        type: rich-text
