<footer class="site-footer">
  <div>
    <p class="footer-heading">Elsewhere</p>
    <nav class="footer-links" aria-label="Elsewhere">
      {{ range site.Params.links }}<a href="{{ .url }}">{{ .name }}</a>
      {{ end }}
    </nav>
  </div>
  <a class="rss-link" href="{{ with site.GetPage (printf "/%s" site.Params.mainSection) }}{{ with .OutputFormats.Get "RSS" }}{{ .RelPermalink }}{{ end }}{{ end }}">RSS</a>
</footer>
