<header class="site-header">
  <div class="site-header-inner">
    <a class="site-wordmark" href="/">{{ .Site.Title }}</a>
    <nav>
      <ul class="site-nav">
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if eq .URL $.RelPermalink }} class="active"{{ end }}{{ if strings.HasPrefix .URL "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
